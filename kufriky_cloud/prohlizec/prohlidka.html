<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITULEK__</title>
<style>
/* Prohlídka více 3D modelů najednou: výběr modelu, otáčení, pohyblivé části, řez. Samostatný soubor bez sítě. */
:root{--bg:#e8ecf0;--fg:#16202a;--panel:rgba(255,255,255,.92);--line:#c3ccd5;--accent:#c8102e;--muted:#52606d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151a;--fg:#e8edf2;--panel:rgba(28,35,43,.92);--line:#34404c;--accent:#ff5266;--muted:#9aa8b6;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;position:relative}
canvas{display:block;width:100%;height:100%}
#panel{position:absolute;left:12px;top:12px;width:min(360px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;backdrop-filter:blur(6px)}
#panel h1{font-size:15px;margin:0 0 2px;font-weight:650}#panel small{color:var(--muted);display:block;margin-bottom:6px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}.row label{flex:0 0 120px}.row input[type=range]{flex:1;min-width:90px;accent-color:var(--accent)}
.row input[type=checkbox]{accent-color:var(--accent)}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer}
select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 6px;min-width:0;flex:1;max-width:100%}
button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#hint{position:absolute;left:12px;right:12px;bottom:10px;color:var(--muted);font-size:12px;pointer-events:none}
#poz{color:var(--muted);font-size:12px;white-space:nowrap}
</style></head>
<body>
<div id="panel"><h1 id="titulek">__TITULEK__</h1>
<div class="row"><button id="b-pred" title="předchozí (šipka vlevo)">◀</button><select id="vyber"></select><button id="b-dalsi" title="další (šipka vpravo)">▶</button><span id="poz"></span></div>
<small id="info"></small><div id="ovl"></div>
<div class="row"><label>řez modelem</label><select id="rez-osa"><option value="">vypnuto</option><option value="y">podél (Y)</option><option value="x">příčně (X)</option><option value="z">vodorovně (Z)</option></select></div><div class="row" id="rez-r" hidden><label>poloha řezu</label><input id="rez-p" type="range" min="-250" max="250" value="0" step="1"><span id="rez-v">0 mm</span></div>
<div class="row"><button id="b-celo">čelo</button><button id="b-sikmo">šikmo</button><button id="b-shora">shora</button><button id="b-zezadu">zezadu</button><button id="b-spodek">spodek</button></div></div>
<div id="hint">Táhni myší nebo prstem: otáčení. Kolečko / štípnutí: přiblížení. Pravé tlačítko / dva prsty: posun. Šipky vlevo/vpravo: další model. Rozměry v mm.</div>
<!--THREE_SCRIPTS-->
<script>
const MODELY = __MODELY__;   // [{id, nazev, b64}] vloženo balicím skriptem
function parseGLB(buf){
  const dv=new DataView(buf); if(dv.getUint32(0,true)!==0x46546C67) throw new Error('není GLB');
  const jl=dv.getUint32(12,true); const gltf=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,20,jl))); const bin=buf.slice(20+jl+8);
  const acc=i=>{const a=gltf.accessors[i],bv=gltf.bufferViews[a.bufferView];const o=(bv.byteOffset||0)+(a.byteOffset||0);const n={SCALAR:1,VEC3:3}[a.type];
    if(a.componentType===5126)return new Float32Array(bin,o,a.count*n);
    if(a.componentType===5123)return new Uint16Array(bin,o,a.count*n);
    return new Uint32Array(bin,o,a.count*n);};
  return {gltf,acc};
}
function makeMats(gltf){return gltf.materials.map(m=>{const p=m.pbrMetallicRoughness,c=p.baseColorFactor;
  const mm=new THREE.MeshPhysicalMaterial({color:new THREE.Color(c[0],c[1],c[2]),metalness:p.metallicFactor,roughness:p.roughnessFactor,side:m.doubleSided?THREE.DoubleSide:THREE.FrontSide});
  if(c[3]<1){mm.transparent=true;mm.opacity=c[3];mm.depthWrite=false;} return mm;});}
function buildNode(g,ni,mats){
  const n=g.gltf.nodes[ni]; const o=new THREE.Object3D(); o.name=n.name||''; o.userData=n.extras||{};
  if(n.translation)o.position.set(...n.translation);
  o.userData.__p0=o.position.clone();
  if(n.mesh!==undefined){const prim=g.gltf.meshes[n.mesh].primitives[0];const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(g.acc(prim.attributes.POSITION),3));geo.setAttribute('normal',new THREE.BufferAttribute(g.acc(prim.attributes.NORMAL),3));
    geo.setIndex(new THREE.BufferAttribute(g.acc(prim.indices),1));const m=new THREE.Mesh(geo,mats[prim.material]);m.name=n.name;o.add(m);}
  for(const c of n.children||[])o.add(buildNode(g,c,mats)); return o;
}
(function(){
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.localClippingEnabled=true;renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x000000,0);renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;
  document.body.prepend(renderer.domElement);
  const scene=new THREE.Scene();
  const es=new THREE.Scene();const sg=new THREE.SphereGeometry(50,32,16);const cols=[];const pp=sg.attributes.position;
  for(let i=0;i<pp.count;i++){const t=(pp.getY(i)/50+1)/2;cols.push(.5+.5*t,.53+.47*t,.57+.43*t);} sg.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  es.add(new THREE.Mesh(sg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
  const lm=new THREE.MeshBasicMaterial({color:0xffffff});const l1=new THREE.Mesh(new THREE.BoxGeometry(30,2,30),lm);l1.position.set(0,45,0);es.add(l1);
  const l2=new THREE.Mesh(new THREE.BoxGeometry(2,30,40),lm);l2.position.set(-45,10,0);es.add(l2);
  const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(es,.02).texture;
  const key=new THREE.DirectionalLight(0xffffff,.9);key.position.set(300,-400,700);scene.add(key);
  const fill=new THREE.DirectionalLight(0xffffff,.3);fill.position.set(-500,200,200);scene.add(fill);
  const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,5,40000);camera.up.set(0,0,1);
  const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.12;
  const sel=document.getElementById('vyber'),poz=document.getElementById('poz'),ovl=document.getElementById('ovl');
  MODELY.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=m.nazev;sel.appendChild(o);});
  const planes={x:new THREE.Plane(new THREE.Vector3(-1,0,0),0),y:new THREE.Plane(new THREE.Vector3(0,-1,0),0),z:new THREE.Plane(new THREE.Vector3(0,0,-1),0)};
  const rOsa=document.getElementById('rez-osa'),rP=document.getElementById('rez-p'),rV=document.getElementById('rez-v'),rR=document.getElementById('rez-r');
  let cur=null; // {root,mats,g,size,R,front,lim}
  function uvolni(){if(!cur)return;scene.remove(cur.root);cur.root.traverse(o=>{if(o.geometry)o.geometry.dispose();});cur.mats.forEach(m=>m.dispose());cur=null;}
  function pohled(az,el,k=2.2){if(!cur)return;const a=az*Math.PI/180,e=el*Math.PI/180,d=cur.R*k*1.5;camera.position.set(d*Math.cos(e)*Math.cos(a),d*Math.cos(e)*Math.sin(a),d*Math.sin(e));controls.target.set(0,0,0);controls.update();}
  const bt={celo:[0,6],sikmo:[32,26],shora:[0,88],zezadu:[150,26],spodek:[20,-60]};
  for(const [k,v] of Object.entries(bt))document.getElementById('b-'+k).onclick=()=>{if(cur)pohled(cur.front+v[0],v[1]);};
  function rez(){if(!cur)return;const ax=rOsa.value;rR.hidden=!ax;const {mats,g,lim}=cur;
    if(ax){const [a,b]=lim[ax];rP.min=Math.floor(a);rP.max=Math.ceil(b);if(+rP.value<a||+rP.value>b)rP.value=0;
      const pl=planes[ax];pl.constant=+rP.value;rV.textContent=rP.value+' mm';
      for(const m of mats){m.clippingPlanes=[pl];m.side=THREE.DoubleSide;m.needsUpdate=true;}}
    else{mats.forEach((m,i)=>{m.clippingPlanes=null;m.side=g.gltf.materials[i].doubleSided?THREE.DoubleSide:THREE.FrontSide;m.needsUpdate=true;});}}
  rOsa.onchange=()=>{rP.value=0;rez();};rP.oninput=rez;
  function posuvniky(root){
    ovl.innerHTML='';
    // rotační uzly (extras.osa) a posuvné uzly (extras.posuv_osa|posun_osa) – skupiny podle názvu bez číslice na konci
    const rot={},pos={};
    root.traverse(o=>{const u=o.userData||{};
      if(u.osa){const k=o.name.replace(/[_\-\s]?(\d+|L|P)$/,'');(rot[k]=rot[k]||[]).push(o);}
      else if(u.posuv_osa||u.posun_osa){const k=o.name.replace(/[_\-\s]?(\d+|L|P)$/,'');(pos[k]=pos[k]||[]).push(o);}});
    for(const [k,arr] of Object.entries(rot)){
      const max=arr[0].userData.max_uhel||110;const row=document.createElement('div');row.className='row';
      row.innerHTML=`<label>${k==='vicko'?'víko – otevření':k.replace(/_/g,' ')+' – otočení'}</label><input type=range min=${arr[0].userData.min_uhel||0} max=${max} value=0 step=1><span>0°</span>`;
      const inp=row.querySelector('input'),sp=row.querySelector('span');
      inp.oninput=()=>{const a=+inp.value;sp.textContent=a+'°';for(const o of arr){const ax=new THREE.Vector3(...o.userData.osa).normalize();o.quaternion.setFromAxisAngle(ax,a*Math.PI/180);}};
      ovl.appendChild(row);
      if(/vicko|lid/i.test(k)){const r2=document.createElement('div');r2.className='row';r2.innerHTML='<label>víko – zobrazit</label><input type=checkbox checked>';r2.querySelector('input').onchange=e=>{for(const o of arr)o.visible=e.target.checked;};ovl.appendChild(r2);}
    }
    for(const [k,arr] of Object.entries(pos)){
      const u=arr[0].userData;const max=u.max_posuv||u.zdvih_max||u.max_posun||300;const row=document.createElement('div');row.className='row';
      row.innerHTML=`<label>${k.replace(/_/g,' ')} – posun</label><input type=range min=0 max=${max} value=0 step=1><span>0 mm</span>`;
      const inp=row.querySelector('input'),sp=row.querySelector('span');
      inp.oninput=()=>{const s=+inp.value;sp.textContent=s+' mm';for(const o of arr){const uu=o.userData;const ax=new THREE.Vector3(...(uu.posuv_osa||uu.posun_osa)).normalize();o.position.copy(o.userData.__p0).addScaledVector(ax,s);}};
      ovl.appendChild(row);
    }
  }
  function nacti(i){
    i=(i+MODELY.length)%MODELY.length;sel.value=i;uvolni();
    const m=MODELY[i];const bin=atob(m.b64);const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);
    const g=parseGLB(u.buffer),meta=g.gltf.asset.extras||{};const mats=makeMats(g.gltf);const root=new THREE.Group();scene.add(root);
    for(const ni of g.gltf.scenes[g.gltf.scene].nodes)root.add(buildNode(g,ni,mats));
    const bb=new THREE.Box3().setFromObject(root);const size=bb.getSize(new THREE.Vector3());
    const R=Math.max(size.x,size.y,size.z);const front=(meta.osy||'').includes('celo +Y')?90:0;
    cur={root,mats,g,size,R,front,lim:{x:[-size.x/2,size.x/2],y:[-size.y/2,size.y/2],z:[-size.z/2,size.z/2]}};
    document.getElementById('info').textContent=`obálka ${size.x.toFixed(0)} × ${size.y.toFixed(0)} × ${size.z.toFixed(0)} mm (X × Y × Z) · dílů ${g.gltf.meshes.length}${meta.sku?' · '+meta.sku:''}`;
    poz.textContent=(i+1)+' / '+MODELY.length;
    rOsa.value='';rR.hidden=true;posuvniky(root);
    if(meta.start&&meta.start.target){const st=meta.start,a=st.az*Math.PI/180,e=st.el*Math.PI/180;camera.position.set(st.target[0]+st.dist*Math.cos(e)*Math.cos(a),st.target[1]+st.dist*Math.cos(e)*Math.sin(a),st.target[2]+st.dist*Math.sin(e));controls.target.set(...st.target);controls.update();}else pohled(front+32,26);
  }
  sel.onchange=()=>nacti(+sel.value);
  document.getElementById('b-pred').onclick=()=>nacti(+sel.value-1);document.getElementById('b-dalsi').onclick=()=>nacti(+sel.value+1);
  addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft')nacti(+sel.value-1);if(e.key==='ArrowRight')nacti(+sel.value+1);});
  addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
  nacti(0);
  (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
})();
</script></body></html>
