<!-- bot16, 2026-09-17 (Robert: "chci zkusit pismo ktere ma logiman.cz
     v menu, jen na nase menu") - logiman.cz (Shoptet) pouziva Open Sans
     (--template-font: "Open Sans", viz open-sans.css font-face soubor

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/brand-logo.css">
<style>
  :root {
    --bg: #494b50;
    --panel-bg: #22262e;
    --panel-bg-alt: #1a1d23;
    --border: #3a3f4a;
    --border-soft: #333333;
    --border-faint: #262a32;
    --text: #e8eaed;
    --text2: #c7ccd4;
    --text-muted: #8b93a1;
    --text-faint: #6f7684;
    --text-dim: #666666;
    --accent: #9fd0ff;
    --btn-bg: #3a5a7a;
    --btn-bg-hover: #4a6a8a;
    --control-bg: #2b3038;
    --error: #e07070;
    --success: #7ed49a;
    --warn: #e0a070;
    --sidebar-accent: #0e8a45;
    --sidebar-accent-bright: #1fbe5c;
  }
  [data-theme="light"] {
    --bg: #eef1f5;
    --panel-bg: #ffffff;
    --panel-bg-alt: #f3f5f8;
    --border: #d7dce3;
    --border-soft: #e3e7ec;
    --border-faint: #e8ebef;
    --text: #1b1e24;
    --text2: #3a3f4a;
    --text-muted: #5c6570;
    --text-faint: #97a0ab;
    --text-dim: #a7afb9;
    --accent: #1a6fd4;
    --btn-bg: #2f6690;
    --btn-bg-hover: #3a76a0;
    --control-bg: #e7eaef;
    --error: #c23b3b;
    --success: #2f9e5c;
    --warn: #b8721f;
    --sidebar-accent: #0e8a45;
    --sidebar-accent-bright: #1fbe5c;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; min-height:100%; font-family:var(--font-main, -apple-system, "Segoe UI", Roboto, Arial, sans-serif); background:var(--bg); color:var(--text); font-size:14px; }
  /* Robert 2026-08-09 ("mohla by by byt kazda pata cara oranzova v jednom
     smeru?") - v 45deg smeru je kazda 5. cara (630px = 5x126px cyklus)
     oranzova (--warn) mist bile/tmave, -45deg smer beze zmeny. */
  /* Robert 2026-08-09 ("diagonalu, tu spodni na eshopu zrus, a tu horni
     o polovinu udelej tenci") - -45deg smer (sestupna \, bez oranzove)
     uplne odstranen, 45deg smer (stoupajici /, s oranzovou) zustava,
     jen kazda cara na polovicni tloustku (1px -> 0.5px, oranzova
     2px -> 1px). */
  [data-theme="dark"] body {
    background-image:
      repeating-linear-gradient(45deg,
        transparent 0 126px, rgba(255,255,255,0.10) 126px 126.5px,
        transparent 126.5px 252px, rgba(255,255,255,0.10) 252px 252.5px,
        transparent 252.5px 378px, rgba(255,255,255,0.10) 378px 378.5px,
        transparent 378.5px 504px, rgba(255,255,255,0.10) 504px 504.5px,
        transparent 504.5px 630px, color-mix(in srgb, var(--warn) 55%, transparent) 630px 631px);
    background-attachment: fixed;
  }
  /* Robert 2026-08-09 ("ve svetlem rezimu to zesil, neni to videt") -
     stejna sikma mrizka jako v tmavem motivu chybela pro svetly (pravidlo
     existovalo jen pro [data-theme="dark"]), takze ve svetlem rezimu
     nebylo pozadi videt vubec. Tmave linky mist bilych, o neco silnejsi
     krytí (0.10 -> 0.14), at jsou na svetlem pozadi stejne citelne. */
  [data-theme="light"] body {
    background-image:
      repeating-linear-gradient(45deg,
        transparent 0 126px, rgba(20,30,45,0.14) 126px 126.5px,
        transparent 126.5px 252px, rgba(20,30,45,0.14) 252px 252.5px,
        transparent 252.5px 378px, rgba(20,30,45,0.14) 378px 378.5px,
        transparent 378.5px 504px, rgba(20,30,45,0.14) 504px 504.5px,
        transparent 504.5px 630px, color-mix(in srgb, var(--warn) 55%, transparent) 630px 631px);
    background-attachment: fixed;
  }
  body { display:flex; flex-direction:column; min-height:100vh; }
  header {
    height:56px; background:var(--panel-bg); border-bottom:1px solid var(--border-soft); display:flex;
    align-items:center; justify-content:space-between; padding:0 20px; position:relative; z-index:100; flex-shrink:0;
  }
  header .brand { font-size:14px; color:var(--text); font-weight:600; text-decoration:none; }
  /* Textove logo (.brand-logo*): sdilene CSS /css/brand-logo.css, nacitane v <head> - vzhled a zduvodneni upravuj JEN tam. */
  /* HOME tlacitko (Robert primo, 2026-09-15 pres bot3: "stylove HUD
     tlacitko Domu na vsech strankach, vedle loga") - stejny vizualni
     jazyk jako #pdAddCartBtn v product.html (useknuty roh, --accent
     obrys). Zadny sdileny JS/CSS soubor mezi strankami (stejny vzor
     jako uz existujici renderAreaSwitch) - kopie na kazdou stranku. */
  .home-hud-btn {
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; flex:none; box-sizing:border-box;
    background:transparent; color:var(--accent); border:1px solid var(--accent); border-radius:0;
    clip-path:polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 7px 100%, 0 calc(100% - 7px));
    font-size:15px; line-height:1; text-decoration:none; cursor:pointer;
    transition:background-color .15s ease, color .15s ease;
  }
  .home-hud-btn:hover { background:var(--accent); color:#06140c; }
  #areaSwitch { display:flex; align-items:center; gap:2px; background:rgba(127,127,127,.15); border-radius:0; padding:3px; }
  #areaSwitch .as-item { padding:5px 10px; border-radius:0; font-size:12px; text-decoration:none; color:var(--text2); }
  #areaSwitch a.as-item:hover { color:var(--accent); }
  #areaSwitch .as-item.active { background:var(--btn-bg); color:#fff; font-weight:600; }
  #userBox { display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-muted); }
  #userBox a, #userBox button { color:#fff; background:var(--btn-bg); border:none; border-radius:0; padding:7px 14px; cursor:pointer; font-size:12.5px; text-decoration:none; }
  #userBox a:hover, #userBox button:hover { background:var(--btn-bg-hover); }
  #userBox .logout-btn { background:none; border:1px solid var(--border); color:var(--text2); }
  #userBox .logout-btn:hover { background:var(--control-bg); }

  .layout { flex:1; display:flex; align-items:flex-start; min-height:0; gap:20px; padding:20px 20px 0; }
  .sidebar {
    position:relative;
    width:max-content; min-width:220px; max-width:380px; flex-shrink:0;
    background:var(--cat-tree-bg-outer, var(--panel-bg-alt));
    border:1px solid var(--border-soft);
    border-radius:0; box-shadow:0 2px 8px rgba(0,0,0,.12);
    /* bot16, 2026-09-17 (Robert: "mluvim o tech zkoseny rozich" - ne male
       HUD kridky/registracni znacky (.corner-mark), ale useknuty roh
       clip-path, stejny vzor jako uz .sidebar-footer/.cat-body/
       .home-hud-btn - tady zvetseno na 14px, odpovida velikosti boxu. */
    clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    padding:20px 16px 24px;
    /* Robert 2026-09-26 - viz category.html: max-height/overflow-y
       zruseno, strom kategorii roste do prirozene vysky, bez posuvniku. */
    overflow-x:hidden;
  }
  .corner-mark { position:absolute; width:9px; height:9px; pointer-events:none; }
  .corner-mark::before, .corner-mark::after { content:""; position:absolute; background:var(--sidebar-accent); }
  .corner-mark::before { top:50%; left:0; right:0; height:1px; transform:translateY(-50%); }
  .corner-mark::after { left:50%; top:0; bottom:0; width:1px; transform:translateX(-50%); }
  /* bot16, 2026-09-17 (Robert: "zakladnimu ramecku menu chybi hud rohy" -
     -4px = MIMO padding box .sidebar, ale ten ma overflow-x:hidden (viz
     komentar tamtez, "vodorovny posuvnik u dlouheho nazvu") - overflow
     orizne VSECHNY potomky za padding hranici bez ohledu na z-index,
     takze rohy nebyly vubec videt, v zadnem motivu/barve pozadi. Male
     kladne posunuti dovnitr misto zaporneho ven - porad ctou jako rohova
     HUD znacka, jen uz je uvnitr orezove oblasti. */
  .corner-mark.tl { top:2px; left:2px; } .corner-mark.tr { top:2px; right:2px; }
  .corner-mark.bl { bottom:2px; left:2px; } .corner-mark.br { bottom:2px; right:2px; }
  /* Robert 2026-08-11 ("Menu neni responzivni") - zaviraci krizek
     mobilniho supliku s kategoriemi. Na desktopu skryty (sidebar je
     tam trvale viditelny sloupec, neni co zavirat), zapina se az
     v mobilnim breakpointu nize. */
  .sidebar-close {
    display:none; position:absolute; top:10px; right:10px;
    width:30px; height:30px; align-items:center; justify-content:center;
    background:none; border:1px solid var(--border); border-radius:0;
    color:var(--text2); font-size:20px; line-height:1; cursor:pointer; padding:0;
  }
  .sidebar-title {
    font-family:"SF Mono","Cascadia Code","Consolas",monospace; font-size:10.5px; color:var(--cat-tree-text-outer, var(--sidebar-accent));
    text-transform:uppercase; letter-spacing:.1em; font-weight:600; margin:0 0 12px;
    padding-bottom:9px; border-bottom:1px solid var(--border-soft);
  }
  .main-content { flex:1; min-width:0; overflow-x:hidden; padding-bottom:20px; }
  /* bot16, 2026-09-17 (Robert: "vsechny stranky se musi mit stejnou
     sirku, neni unifikovana") - category.html/product.html uz maji
     .page-wrap (max-width:1600px), tahle stranka ho postradala -
     obsah .main-content se tak roztahoval do CELE dostupne sirky
     (zadny strop) na sirokych monitorech, jina sirka nez zbyle 2
     stranky. Stejne pravidlo, presna kopie z category.html. */
  .page-wrap { max-width:1600px; margin:0; padding:28px 24px 60px; }

  .hamburger-btn { display:none; background:none; border:1px solid var(--border); color:var(--text2); border-radius:0; width:34px; height:34px; font-size:14px; cursor:pointer; align-items:center; justify-content:center; flex-shrink:0; }
  /* Robert 2026-08-10 ("vloz tam nejdrive panel ktery bude videt vzdy
     na vsech url webu... vlevo pod menu, do toho panelu pak vlozime
     video") - trvaly panel pod stromem kategorii, na VSECH 4 strankach
     se sidebarem (index/category/product/blok). Zatim prazdny (obsah
     pribude v navazujici zmene) - display:none, aby nezustaval na
     zivem webu jako prazdny ohraniceny box mezitim. */
  /* Robert 2026-08-10 ("je to useknute prodluz to okno" + "proc je to
     tak nalepene na menu") - oprava 2 chyb: (1) puvodni CSS omylem
     duplikovalo .sidebar-footer-title/-video (2x stejne pravidlo,
     zustatek z prvni "hardcoded video" verze pred prepsanim na
     dynamicky render) - uklizeno na 1 definici kazde. (2) portretove
     video (720x1280, 9:16) se v uzkem sidebaru (max-width 380px)
     vykreslovalo cca 650px vysoke - vetsinou vyssi nez cely viditelny
     sidebar (max-height:calc(100vh - 96px) na .sidebar), takze
     vypadalo "usteknute" presne na hranici box. Reseno max-height +
     object-fit:cover (oriznuti stran, ne cele natazeni) - misto
     nutnosti scrollovat uzky sidebar pro cely portretovy snimek.
     Odstup od stromu kategorii zvetsen (margin-top 20px -> 28px). */
  /* Robert 2026-08-10 ("vrať se a oddělene od menu pridej dlazdici") -
     panel VYNDAN z <aside class="sidebar"> (uz nesdili jeho
     max-height:calc(100vh - 96px)/overflow-y:auto urcene pro
     scrollovaci strom kategorii - to zpusobovalo "nalepeni"/oriznuti
     nahlasene drive). Novy .left-column obaluje <aside> i panel jako
     2 samostatne boxy nad sebou (misto uvnitr jednoho scrollovaciho
     ramecku), sdili jen sirku se sidebarem (width:max-content).
     Video/obrazek: robustni crop technika (wrapper s pevnym
     aspect-ratio + video/img absolutne pozicovane pres cely wrapper,
     object-fit:cover) - predchozi pokus (max-height primo na <video
     controls>) se choval nespolehlive, protoze nativni ovladaci lista
     prohlizece zabirala misto NAD ramec zadane vysky, misto aby ho
     jen prekryvala. */
  /* bot16, 2026-09-14 (Robert primo, screenshot: "chci aby to video
     melo vzdy stejnou sirku jako má responzivne menu") - align-items
     zmeneno z flex-start na stretch, at .sidebar-footer (video panel)
     vzdy sedi na stejnou sirku jako .sidebar (strom kategorii) nad nim
     - stejny bug/oprava jako index.html, viz tam plne odduvodneni. */
  .left-column { display:flex; flex-direction:column; gap:20px; flex-shrink:0; width:max-content; align-items:stretch; }
  /* HUD dlazdice - stejny vzor jako .hp-block-card/.cat-product-card
     (useknute rohy + zarici zelene->oranzove rohove zavorky pri hoveru),
     "jako mame vsude jinde" (Robert 2026-08-10). Pevne (theme-independent)
     tmave pozadi + svetly text, protoze karty s timhle vzorem to maji
     vsude stejne (viz .hp-block-card). */
  .sidebar-footer {
    position:relative; display:none;
    background:var(--base-dark, #1a1d23); border:1px solid var(--border); border-radius:0; padding:0;
    clip-path:polygon(0 12px, 12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
    box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  .sidebar-footer::before, .sidebar-footer::after { content:""; position:absolute; width:16px; height:16px; pointer-events:none; transition:border-color .15s, box-shadow .15s; }
  .sidebar-footer::before { top:-1px; right:-1px; border-top:2px solid var(--accent); border-right:2px solid var(--accent); }
  .sidebar-footer::after { bottom:-1px; left:-1px; border-bottom:2px solid var(--accent); border-left:2px solid var(--accent); }
  .sidebar-footer:hover::before, .sidebar-footer:hover::after { border-color:var(--warn); box-shadow:0 0 8px color-mix(in srgb, var(--warn) 60%, transparent); }
  .sidebar-footer-title { font-size:14px; line-height:1.4; color:#e8eaed; font-weight:600; margin:0; padding:14px 14px 8px; }
  .sidebar-footer-media, .sidebar-footer-video-wrap { display:block; position:relative; width:100%; aspect-ratio:3/4; overflow:hidden; background:#000; text-decoration:none; }
  .sidebar-footer-media img, .sidebar-footer-video-wrap video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .sidebar-footer-excerpt { font-size:13px; color:#9aa4b2; padding:8px 14px 14px; margin:0; line-height:1.5; }
  #sidebarOverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:140; }
  #sidebarOverlay.open { display:block; }
  @media (max-width:860px) {
    .hamburger-btn { display:flex; }
    /* Robert 2026-08-11 ("zkus pro mobil deaktivovat uplne 3D scenu
       jakoby nebyla") - scene.html zustava desktop-only (drivejsi
       rozhodnuti), takze odkaz na ni v mobilnim prepinaci Eshop/3D
       scena nema smysl zobrazovat. */
    a.as-item[href="/scene.html"] { display:none; }
    /* Robert ("Nevidím nic právě" / "Jakoukoliv kategorii vidím
       prázdnou") - KRITICKY bug: .layout je "display:flex" (radek) BEZ
       flex-wrap, .left-column ma "width:100%" (nize v tomto bloku) -
       v neprelamanem flex radku to donutilo .main-content (flex:1,
       min-width:0) zmensit se skoro na 0px sirky. Oprava: flex-wrap,
       aby se oba prelomily na 2 samostatne radky, kazdy dostane svou
       celou sirku. */
    /* Robert 2026-08-11 - POTVRZENO MERENIM na realnem iPhonu (390px
       viewport): .left-column w=390 h=0, .main-content w=0 h=2146
       x=390 -> cely obsah stranky byl stlaceny na nulovou sirku a
       odsunuty presne za pravy okraj obrazovky. Drivejsi pokus
       "flex-wrap:wrap" NEMOHL zabrat: .main-content ma flex:1, tedy
       flex-basis:0% - prvek s nulovym zakladem se do radku vzdy
       "vejde", takze se nikdy nezalomi, jen dostane 0px sirky
       (zalamovani se ridi flex-basis, ne obsahem). Reseni: na mobilu
       z .layout zrusit flex uplne, oba potomci se pak poskladaji pod
       sebe jako bezne bloky a .main-content dostane plnou sirku. */
    .layout { gap:0; padding:0; display:block; }
    .main-content { width:100%; }
    .main-content { padding-bottom:0; }
    /* Robert 2026-08-11 ("Menu neni responzivni") - mobilni suplik mel
       2 chyby: (1) top:56px pocital s puvodni jednoradkovou hlavickou,
       jenze ta se od responzivni opravy zalamuje (~103px), takze suplik
       prekryval spodni radek hlavicky (kosik/hledani) - ted je pres
       celou vysku, jak je u mobilnich supliku zvykem; (2) strom
       kategorii dedil desktopovou velikost pisma 16px, ktera se do
       uzkeho supliku nevejde - skoro kazdy nazev se lamal do 2 radku
       (viz Robertuv screenshot). Zmenseno na 14px s tesnejsim
       radkovanim; klikaci plocha zustava ~40px vysoka, tedy pohodlna
       na prst. Suplik je scrollovatelny, protoze pres celou vysku se
       dlouhy strom kategorii jinak nevejde. */
    .sidebar {
      position:fixed; top:0; left:-100%; bottom:0; width:min(86vw, 320px);
      max-width:none; min-width:0; z-index:150;
      transition:left .2s ease; box-shadow:2px 0 16px rgba(0,0,0,.35);
      border-radius:0; border:none; max-height:none;
      overflow-y:auto; -webkit-overflow-scrolling:touch;
      padding:14px 14px 24px;
    }
    .sidebar.mobile-open { left:0; }
    /* Suplik pres celou vysku prekryje i hamburger, takze musi mit
       vlastni zaviraci krizek (klepnuti na ztmavene pozadi funguje
       dal, ale nesmi byt jedina cesta zpet). */
    .sidebar-close { display:flex; }
    .sidebar-title { padding-right:34px; }
    .cat-tree-row { gap:2px; }
    .cat-tree-toggle {
      width:28px; height:28px; display:inline-flex;
      align-items:center; justify-content:center; font-size:15px;
    }
    .cat-tree-name { font-size:14px; line-height:1.35; letter-spacing:0; padding:8px 4px; }
    .cat-tree-children { margin-left:12px; }
    .left-column { width:100%; }
    /* bot16, 2026-09-14 - stejna sirkova formule jako .sidebar v
       tomhle breakpointu (min(86vw,320px), viz vyse) - i kdyz .sidebar
       je tu jako position:fixed suplik mimo normalni tok (uz nesdili
       box s .left-column), video panel ma i tak vypadat stejne siroke. */
    .sidebar-footer { margin:12px 16px 0; width:min(86vw, 320px); }
    /* Robert ("kompletně opravit responzivní web pro mobil") - header
       drive dostal flex-wrap az pod 600px, ale hamburger nastupuje uz
       pod 860px - mezi 601-860px header zustaval v 1 neprelamanem
       radku a mohl prekrocit sirku obrazovky. */
    header { flex-wrap:wrap; height:auto; min-height:56px; padding:10px 14px; row-gap:8px; }
    header > div:last-of-type { flex-wrap:wrap; row-gap:6px; }
    #userBox span { max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  }
  /* bot16, 2026-09-17 (Robert: "dokola a dokola, stredni sedy to ukoseni
     nema") - "stredni sedy blok" NENI samostatny element s vlastnim
     pozadim (.cat-tree samo o sobe zadne pozadi nema) - je to jen
     souvisly dojem ze sousednich radku (.cat-tree-node[data-depth] >
     .cat-tree-row) se stejnou barvou "radky". clip-path primo na
     .cat-tree orizne VSECHNY potomky (tedy i jejich pozadi) na stejnem
     useknutem tvaru jako .sidebar/.cat-admin-tree-colors, aniz by bylo
     nutne menit hloubkove odstupnovani jednotlivych radku. */
  /* bot16, 2026-09-26 (Robert: "zkus aplikovat menu jako cisty strom
     dle A, ale ponechat efekty" - viz Design Canvas "Menu kategorii -
     varianty") - HUD ramecek/chamfer z varianty D (border+clip-path
     na .cat-tree/.cat-tree-row, aktivni radek jako plne orámovaný box)
     ODSTRANEN, nahrazeno plochym seznamem varianty A: zadny ramecek,
     aktivni polozka = tenky levy prouzek (border-left, viz .cat-tree-row:
     has(.cat-tree-name.active) nize) + jemne pozadi, zanorene vetve
     dostaly VODICI CARU (.cat-tree-children border-left) misto A-ciho
     staticky-pozicovaneho .guide divu (nejde na dynamicky strom,
     border-left na kontejneru dela presne totez robustneji). EFEKTY
     Robert vyslovne rekl ponechat - sweep hover (::before/::after +
     catTreeSweepX/Y nize) a CELY admin barevny system (bg_rows/
     nested/open/active/hover, text_*, border_width, caps) zustavaji
     beze zmeny, jen uz nekresli obrys/vypln ramecku. */
  .cat-tree { text-align:left; clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px)); }
  /* bot16, 2026-09-25 (Robert primo, ziva iterace v Artifact preview -
     "chci mezi nazvy kategorii s mezerami jakoby to byly tlacitka", pak
     doslovne po zhlednuti: "zustane tedy levy a horni lem, a jezdici
     prouzek") - kazdy radek stromu ted vypada jako samostatne HUD
     tlacitko, stejny useknuty roh jako .home-hud-btn/.sidebar/.cat-tree

     border-bottom explicitne none) + realna mezera mezi radky (margin-
     bottom, misto puvodniho padding:2px 0 ktere zadnou viditelnou mezeru
     nedelalo). Hloubkove ladeni barvy (border-color/background nize) i
     .is-open "sklenena" karta zustavaji stejny mechanismus - meni se jen
     tvar/mezera radku. */
  /* bot16, 2026-09-26 (Robert po designove revizi v artifactu "Menu
     kategorii - varianty", vybral variantu D - "kombinace A a B, aspon
     neco je HUD") - vychozi border uz neni transparentni, ale VZDY
     viditelny (--border-soft) - lehky HUD ramecek na hlavni (depth 0)
     polozce, misto drivejsiho "obrys se objevi az na hover/aktivni". */
    /* bot16, 2026-09-26 (Robert: "neni tam radny hover efekt !!") -
     zive overeno Playwrightem: ramecek TAM byl (spravna sirka/animace),
     ale --border-soft (#333333, tmave sedy) byl na Robertove aktualnim
     podkladu bocniho panelu (#48505b, svetlejsi modrosedy) TMAVSI nez
     pozadi = nulovy kontrast, radek vypadal jako holy text. Nahrazeno
     barvou odvozenou primo od textu radku (--cat-tree-text-rows) v
     pulovicni pruhlednosti - text uz MUSI byt viditelny proti
     jakemukoli pozadi, ktere si Robert zvoli, takze i tenhle ramecek
     bude vzdy viditelny, at nastavi cokoli. */
  .cat-tree-row { display:flex; align-items:center; gap:6px; padding:6px 8px; margin-bottom:1px; clip-path:polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 9px 100%, 0 calc(100% - 9px)); position:relative; overflow:hidden; }
  /* Robert, tyz den: "ten efekt zpomal na pulku rychlosti a aplikuj to
     na web" - nahrazuje puvodni staticky "cely radek zbelal oranzove
     na hover" dvema tenkymi svitivymi stopami, ktere pri najeti
     "prejedou" presne po hornim a levem lemu (jedine dve hrany, co
     radek fyzicky ma - prava/spodni zustava jen useknuty roh bez
     vlastni linky). 2s = polovicni rychlost oproti puvodnimu 1s
     odsouhlasenemu v artifactu.
     ROZSIRENO (bot16, tyz den, Robert u zanoreneho "Vestavby pro
     Fiat": "myši chybí hover efekt, levy+horni lem s efektem
     přejezdu") - puvodne jen depth 0, ted na VSECH urovnich vcetne
     hluboce zanorenych - zanorene radky zustavaji v klidu ploche
     (zadny staly ramecek), sweep se objevi jen po najeti mysi. */
  .cat-tree-row::before, .cat-tree-row::after { content:""; position:absolute; opacity:0; pointer-events:none; }
  .cat-tree-row::before {
    top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent 0%, var(--cat-tree-text-active, var(--sidebar-accent-bright)) 45%, transparent 90%);
    background-repeat:no-repeat; background-size:250% 100%; background-position:200% 0;
  }
  .cat-tree-row::after {
    top:0; left:0; bottom:0; width:2px;
    background:linear-gradient(180deg, transparent 0%, var(--cat-tree-text-active, var(--sidebar-accent-bright)) 45%, transparent 90%);
    background-repeat:no-repeat; background-size:100% 250%; background-position:0 -100%;
  }
  /* bot16, 2026-09-26 (Robert: "ta linka efektova je moc silna,
     ale porad k ni neni zeslabovac, ten posuvnik se tyka jeste jine
     linky") - Sila linek (--cat-tree-border-width) meni jen levy
     prouzek aktivni polozky, tenhle sweep efekt na to nereagoval
     vubec. Vlastni nezavisly ovladac - opacity misto pevne 1. */
  /* bot16, 2026-09-26 (Robert: "ten jezdici lesk efekt nech leti
     podel leveho a horniho lemu v jednom smeru, ted se nejak divne
     vlni ve dvou smerech") - puvodne obe animace (svisla na levem
     lemu, vodorovna na hornim) bezely CELOU dobu SOUCASNE, jen s
     jinou geometrii - vypadalo to jako dva nezavisle vlnici se
     pruhy, ne jeden souvisly pohyb. Ted sdileji JEDEN 2s cyklus,
     kazda aktivni jen v jeho polovine (svisla 0-50%, vodorovna
     50-100%, mimo svou polovinu neviditelna) - vysledkem je JEDEN
     smer pohybu: nahoru podel leveho lemu, pak doprava podel
     horniho, porad dokola. */
  .cat-tree-row:hover::before { animation:catTreeSweepX 2s linear infinite; }
  .cat-tree-row:hover::after { animation:catTreeSweepY 2s linear infinite; }
  /* bot16, 2026-09-26 (Robert: "efekt na linkach hoveru... zacina
     dole na leve lince, jde nahoru, prechazi na levou cast horni
     linky a pokracuje doprava na konec horni linky") - puvodni smer
     (rostouci background-position) sel na hornim lemu DOPRAVA->
     DOLEVA, presny opak. Overeno rucne staticky (bez animace) pres
     CSS specifikaci background-position vzorce - hodnoty tady
     ZAMENENY (200%->-100% misto -100%->200%), levy lem zustava
     stejny (uz spravne zdola nahoru). background-repeat:no-repeat
     vyse pridano, aby se prechazeny rozsah pozic nemohl zdvojit
     (gradient by se jinak dlaždicoval a pusobil jako 2 nezavisle
     zablesky misto jednoho souvisleho pruchodu). */
  @keyframes catTreeSweepX {
    0%, 50% { opacity:0; background-position:200% 0; }
    50.1% { opacity:var(--cat-tree-sweep-opacity, 1); background-position:200% 0; }
    100% { opacity:var(--cat-tree-sweep-opacity, 1); background-position:-100% 0; }
  }
  @keyframes catTreeSweepY {
    0% { opacity:var(--cat-tree-sweep-opacity, 1); background-position:0 -100%; }
    49.9% { opacity:var(--cat-tree-sweep-opacity, 1); background-position:0 200%; }
    50%, 100% { opacity:0; background-position:0 200%; }
  }

  /* bot16, 2026-09-23 (Robert pres bot3: "aktivni polozka barva" cerná

    /* bot16, 2026-09-26 (Robert: "ty barvy zase nereaguji... kdyz to

  /* bot16, 2026-09-26 (Robert: "hover efekt podkategorii jeste neni") -

function applyShopThemeColors() {
  fetch("/api/theme-colors?surface=eshop").then(function (r) { return r.ok ? r.json() : null; }).then(function (data) {
    if (!data) return;
    window.__themeColors = data;
    try { localStorage.setItem("shopThemeColorsCache", JSON.stringify(data)); } catch (e) {}
    var theme = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    var palette = data[theme];
    Object.keys(palette).forEach(function (key) {
      document.documentElement.style.setProperty("--" + key.replace(/_/g, "-"), palette[key]);
    });
  }).catch(function () {});
}
applyShopThemeColors();
function applyShopTheme(theme, opts) {
  opts = opts || {};
  theme = theme === "light" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", theme);
  try { localStorage.setItem("shopTheme", theme); } catch (e) {}
  if (window.__themeColors) {
    var palette = window.__themeColors[theme];
    Object.keys(palette).forEach(function (key) {
      document.documentElement.style.setProperty("--" + key.replace(/_/g, "-"), palette[key]);
    });
  }
  var btn = document.getElementById("themeToggleBtn");
  if (btn) btn.textContent = theme === "light" ? "🌙" : "☀️";
  if (opts.persist) {
    fetch("/api/auth/theme", {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ scope: "shop", theme: theme }),
    }).catch(function () {});
  }
}
function toggleShopTheme() {
  var current = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
  applyShopTheme(current === "light" ? "dark" : "light", { persist: true });
}
document.addEventListener("DOMContentLoaded", function () {
  var btn = document.getElementById("themeToggleBtn");

});

function catUrl(cat) {
  return cat && cat.slug ? `/${cat.slug}` : `/category.html?id=${cat.id}`;
}
function loadCategoryNav() {
  fetch("/api/categories").then(r => r.json()).then(data => {

function renderCategoryTree(tree) {
  const treeEl = document.getElementById("catTree");
  // Robert 2026-08-11 ("probliká podtržítko v menu") - SSR uz strom
  // vykreslil se stejnym vysledkem (viz data-ssr atribut z
  // api/app.py::_add_category_tree_ssr) - prepis DOM by i pri
  // identickem textu restartoval CSS animaci podtrzeni aktivni/hover
  // polozky (viditelny "problik"), tak se preskoci.
  if (treeEl.dataset.ssr === "1") {
    delete treeEl.dataset.ssr;
    // Robert 2026-08-11 ("proc nefunguji ty krizky?") - SSR strom ma
    // +/- jako holé <span> BEZ click handleru (ty vazal jen JS pri
    // vlastni stavbe stromu pres buildCatTreeNode, ktera se tady
    // prave preskakuje). Delegovany listener na celem stromu dodava
    // rozbalovani SSR uzlum; vaze se jen jednou (tahle vetev bezi
    // prave jednou na nacteni stranky).
    treeEl.addEventListener("click", (e) => {
      const t = e.target.closest(".cat-tree-toggle");
      if (!t || t.classList.contains("spacer")) return;
      const children = t.closest(".cat-tree-row")?.nextElementSibling;
      if (!children || !children.classList.contains("cat-tree-children")) return;
      const expanded = children.classList.toggle("expanded");
      t.textContent = expanded ? "\u2212" : "+";
      // bot16, 2026-09-17 (Robert primo: "otevrene vetve musis take
      // barevne odlisit") - drzet .is-open v sync i po rucnim kliku.
      t.closest(".cat-tree-node")?.classList.toggle("is-open", expanded);
    });
    return;
  }
  const empty = document.getElementById("catTreeEmpty");
  treeEl.innerHTML = "";
  if (!tree.length) { empty.style.display = "block"; return; }
  empty.style.display = "none";
  appendCatTreeSiblings(treeEl, tree, 0);
}
// bot16, 2026-09-17 (doplneno po nalezu bot7/Robert): skupinovy nadpis
// patri MEZI sourozence (detekce hranice skupiny), ne "na" jeden uzel -
// zrcadli Python _render_category_tree_html (api/storefront_pages.py).
function appendCatTreeSiblings(container, cats, depth) {
  let prevGroup = null;
  cats.forEach(cat => {
    const group = cat.menu_group_label || null;
    if (group !== prevGroup) {
      const marker = document.createElement("div");
      marker.className = group ? "cat-tree-group-label" : "cat-tree-group-break";
      if (group) marker.textContent = group;
      container.appendChild(marker);
      prevGroup = group;
    }
    container.appendChild(buildCatTreeNode(cat, depth));
  });
}
function buildCatTreeNode(cat, depth) {
  depth = depth || 0;
  const hasChildren = !!(cat.children && cat.children.length);
  const node = document.createElement("div");
  node.className = "cat-tree-node";
  node.dataset.depth = depth;
  const row = document.createElement("div");
  row.className = "cat-tree-row";
  const toggle = document.createElement("span");
  toggle.className = "cat-tree-toggle" + (hasChildren ? "" : " spacer");
  toggle.textContent = "+";
  row.appendChild(toggle);
  const nameEl = document.createElement("span");
  nameEl.className = "cat-tree-name" + (cat.pending_review ? " cat-tree-name-new" : "");
  nameEl.textContent = cat.name;
  nameEl.onclick = () => { window.location.href = catUrl(cat); };
  row.appendChild(nameEl);
  node.appendChild(row);
  const childrenEl = document.createElement("div");
  childrenEl.className = "cat-tree-children";
  appendCatTreeSiblings(childrenEl, cat.children || [], depth + 1);
  node.appendChild(childrenEl);
  if (hasChildren) {
    toggle.onclick = (e) => {
      e.stopPropagation();
      const expanded = childrenEl.classList.toggle("expanded");
      toggle.textContent = expanded ? "−" : "+";
      node.classList.toggle("is-open", expanded);
    };
  }
  return node;
}

const CAT_TREE_COLOR_FIELDS = [

function catTreeColorsApply(state) {
  const root = document.documentElement;
  CAT_TREE_COLOR_FIELDS.forEach(({ field, cssVar, pickerId }) => {
    const hex = state[field];
    if (hex) root.style.setProperty(cssVar, hex); else root.style.removeProperty(cssVar);
    const picker = document.getElementById(pickerId);
    if (hex && picker && document.activeElement !== picker) picker.value = hex;
  });
  // bot16, 2026-09-17 (Robert: "pridej na nase menu prepinac caps vsechno
  // velke") - trida na <html>, viz html.cat-tree-caps-on v CSS.
  root.classList.toggle("cat-tree-caps-on", !!state.caps);
  const capsToggle = document.getElementById("catTreeCapsToggle");
  if (capsToggle && document.activeElement !== capsToggle) capsToggle.checked = !!state.caps;
  // bot16, 2026-09-25 (Robert: "silu linek") - cislo v px primo na
  // var(--cat-tree-border-width), fallback 2px kdyz nic neni ulozeno.
  const bw = state.border_width;
  if (bw) root.style.setProperty("--cat-tree-border-width", bw + "px"); else root.style.removeProperty("--cat-tree-border-width");
  const bwPicker = document.getElementById("catTreeBorderWidthPicker");
  const bwVal = document.getElementById("catTreeBorderWidthVal");
  if (bwPicker && document.activeElement !== bwPicker) bwPicker.value = bw || 2;
  if (bwVal) bwVal.textContent = (bw || 2) + "px";
  // bot16, 2026-09-26 (Robert: "ta linka efektova je moc silna, ale
  // porad k ni neni zeslabovac") - nezavisly na Sile linek vyse (ta

  const sweepOpacity = state.sweep_opacity;
  if (sweepOpacity) root.style.setProperty("--cat-tree-sweep-opacity", sweepOpacity); else root.style.removeProperty("--cat-tree-sweep-opacity");
}

      const media = b.video_url
        ? `<div class="sidebar-footer-video-wrap"><video controls preload="none"${b.image_url ? ` poster="${esc(b.image_url)}"` : ""} playsinline><source src="${esc(b.video_url)}" type="video/mp4"></video></div>`
        : (b.image_url ? `<a class="sidebar-footer-media" href="/panel/${encodeURIComponent(b.slug)}"><img src="${esc(b.image_url)}" alt="${esc(b.title)}"></a>` : "");
      const excerpt = b.meta_description ? `<div class="sidebar-footer-excerpt">${esc(b.meta_description)}</div>` : "";
      return `<div class="sidebar-footer-title"><a href="/panel/${encodeURIComponent(b.slug)}" style="color:inherit;text-decoration:none;">${esc(b.title)}</a></div>${media}${excerpt}`;
    }).join("");
    wrap.style.display = "block";
  }).catch(() => {});
}
loadSidebarFooterPanel();

function openSidebarMobile() {
  document.querySelector(".sidebar").classList.add("mobile-open");
  document.getElementById("sidebarOverlay").classList.add("open");
}
function closeSidebarMobile() {
  document.querySelector(".sidebar").classList.remove("mobile-open");
  document.getElementById("sidebarOverlay").classList.remove("open");
}
document.getElementById("sidebarToggleBtn").onclick = openSidebarMobile;
document.getElementById("sidebarOverlay").onclick = closeSidebarMobile;
document.getElementById("sidebarCloseBtn").onclick = closeSidebarMobile;

let cartData = { items: [], subtotal_czk: 0, item_count: 0, total_qty: 0 };
async function refreshCartBadge() {
  if (!CURRENT_USER) return;
  try {
    const r = await fetch("/api/cart");
    if (!r.ok) return;
    cartData = await r.json();
    updateCartBadgeDisplay();
  } catch (e) {}
}
function updateCartBadgeDisplay() {
  const badge = document.getElementById("cartCount");
  if (!badge) return;
  const n = cartData.total_qty || 0;
  if (n > 0) { badge.style.display = "inline-block"; badge.textContent = n; }
  else { badge.style.display = "none"; }
}
</script>
