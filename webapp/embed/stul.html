<!-- VLOZITELNA verejna varianta generatoru stolu (iframe na logiman.cz): bez hlavicky a paticky, bez zamestnaneckych oken, stejny modul voleb i mrizka oken jako
     stranka produktu mini-shopu. Vyska se posila rodici zpravou postMessage {type:"stul-embed-height", height}. Parametry: ?theme=light|dark, ?p=<id produktu>.
     Pouziti viz docs/EMBED_STUL.md. -->
<link rel="stylesheet" href="/miniweb/miniweb.css?v=7f702de1f3">
<link rel="stylesheet" href="/css/product-configurator.css?v=55f3678f8f">
<!-- predstahnuti 3D prohlizece (bot16 2026-10-04, nalez bot8: model se nacita dlouho): skripty viewera a three z CDN se stahuji uz pri parsovani HTML, paralelne; spusti je pozdeji modul voleb -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preload" as="script" href="/js/v3d/viewer3d.js?v=e6b94b904a">
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js">
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js">
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js">
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js">
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js">
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/HorizontalBlurShader.js">
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VerticalBlurShader.js">
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js">
<link rel="preload" as="script" href="/js/v3d-ovladani.js?v=1bc0d2b6ba">
<style>
  html, body { background: transparent !important; background-image: none !important; margin: 0; }
  body { font-family: var(--font-main); }
  :root { --emb-stage-h: 600px; }                                /* vyska 3D okna na sirokem: JS ji nastavi z vysky okna rodice (?vh=, zprava stul-embed-viewport) */
  .emb-wrap { padding: 8px; }
  .emb-wrap .mw-pdg { margin-top: 0; }
  .emb-price { display: flex; flex-direction: column; gap: 2px; }
  .emb-price .big { font-size: clamp(1.25rem, 2.2vw, 1.65rem); font-weight: 700; line-height: 1.15; }
  .emb-price .small { color: var(--muted); font-size: .82rem; }
  .emb-note { color: var(--muted); font-size: .8rem; margin: 6px 2px 0; }
  .emb-wrap .mw-sum-host .pdc-summary { grid-template-columns: minmax(0, 1fr) auto; } .emb-wrap .mw-sum-host .pdc-summary dd { white-space: nowrap; }   /* souhrn v uzkem sloupci: popisek se zalomi, hodnota (1200 mm) ne */
  .emb-blocked { padding: 16px; border: 1px solid var(--warn); color: var(--warn); }
  /* objednavka: tlacitko pod cenou, stav a odkaz do kosiku / na prihlaseni */
  .emb-order { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .emb-order-btn { width: 100%; min-height: 54px; font-size: 1.05rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  .emb-order-btn:disabled { opacity: .45; cursor: not-allowed; }
  .emb-order-msg { margin: 0; font-size: .85rem; line-height: 1.35; color: var(--muted); }
  .emb-order-msg.ok { color: var(--accent); } .emb-order-msg.err { color: var(--warn); }
  .emb-order-msg a { color: var(--accent); }
  .emb-order .mw-btn[hidden], .emb-order-msg[hidden] { display: none; }
  .emb-order .mw-btn-alt { background: transparent; color: var(--accent); }

  /* montaz (volitelna) a veta o doprave v okne ceny */
  .emb-montaz { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .emb-montaz .mw-opt { gap: .6rem; flex-wrap: wrap; align-items: center; }
  .emb-montaz-state { margin: 6px 0 0; font-size: .85rem; color: var(--muted); }
  .emb-montaz-t { font-weight: 700; } .emb-montaz-amt { color: var(--muted); font-size: .85rem; margin-left: auto; }
  .emb-montaz-rows { margin-top: 8px; display: grid; gap: 4px; } .emb-montaz-rows .emb-co-row > span:last-child { white-space: pre-line; }
  html.emb-standalone, html.emb-standalone body { background: var(--bg) !important; }
  .emb-co-row { display: flex; justify-content: space-between; gap: 1rem; font-size: .88rem; color: var(--text-soft); } .emb-co-row > span:last-child { text-align: right; }
  .emb-co-row.is-strong { color: var(--text); font-weight: 700; } .emb-co-row.is-total { color: var(--text); font-weight: 700; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; }
  .emb-shipnote { color: var(--muted); font-size: .8rem; line-height: 1.35; margin: 10px 2px 0; }
  .emb-order-finish { width: 100%; min-height: 40px; }
  /* objednavka hosta (stul-embed-objednavka.js): druhy krok v iframe misto generatoru */
  .emb-co { padding: 4px 0 18px; max-width: 760px; margin: 0 auto; }
  .emb-co[hidden], .emb-co [hidden] { display: none; }
  .emb-co-head { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; margin-bottom: 14px; }
  .emb-co-head h2 { margin: 0; font-size: 1.15rem; flex: 1 1 auto; } .emb-co-head h2:focus { outline: none; }
  .emb-co-account { color: var(--accent); font-size: .9rem; }
  .emb-co-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 18px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--line); background: var(--panel); }
  .emb-co-line.is-bad { border-color: var(--warn); }
  .emb-co-line-l { flex: 1 1 280px; min-width: 0; } .emb-co-line-l p { margin: 2px 0; } .emb-co-line-r { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .emb-co-line-r input[type="number"] { width: 5rem; min-height: 38px; }
  @media (max-width: 559px) { .emb-co-line-r { flex: 1 1 100%; flex-direction: row; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; } }
  .emb-co-lineprice { margin: 0; text-align: right; } .emb-co-gross { display: block; color: var(--muted); }
  .emb-co-sum { margin-top: 4px; font-size: .85rem; } .emb-co-sum summary { cursor: pointer; color: var(--accent); }
  .emb-co-sum dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; margin: 6px 0 0; } .emb-co-sum dt { color: var(--muted); } .emb-co-sum dd { margin: 0; white-space: nowrap; }
  .emb-co-montaz { margin-top: 6px; font-size: .9rem; }
  .emb-co-warn { color: var(--warn); font-size: .88rem; }
  .emb-co-totals { display: grid; gap: 4px; padding: 10px 12px; margin-bottom: 12px; border: 1px solid var(--line); } .emb-co-totals.is-stale { opacity: .55; }
  .emb-co-shipnote { color: var(--text-soft); font-size: .9rem; margin: 0 0 14px; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--panel); }
  .emb-co-form .mw-win-sub { margin: 1.1rem 0 .5rem; }
  .emb-co-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 14px; }
  @media (min-width: 560px) { .emb-co-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .emb-co-grid.is-zip { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); } }
  .emb-co-err { display: block; color: var(--warn); font-size: .82rem; margin-top: 3px; }
  .emb-co-msg { margin: .8rem 0 0; min-height: 1.3em; font-size: .9rem; } .emb-co-msg.is-err { color: var(--warn); }
  .emb-co-pay { margin: .8rem 0; }
  .emb-co-submit { width: 100%; min-height: 54px; font-size: 1.05rem; margin-top: .6rem; }
  .emb-co-hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .emb-co-done { padding: 18px; border: 1px solid var(--accent); background: var(--panel); } .emb-co-done h3 { margin: 0 0 .6rem; color: var(--accent); }

  /* 3D okno je vysoke, aby byl stul videt cely (Robert 2026-10-04: "okno 3D pohled je moc nizke"): na sirokem ~65 % okna rodice (560-900 px), na uzkem (mobil) podle sirky */
  .emb-wrap .mw-win-stage .mw-pd-media, .emb-wrap .mw-win-stage .mw-pd-media .pdc-stage { min-height: var(--emb-stage-h); }
  @media (max-width: 719px) {
    .emb-wrap .mw-win-stage .mw-pd-media, .emb-wrap .mw-win-stage .mw-pd-media .pdc-stage { min-height: clamp(480px, 140vw, 640px); }
    .emb-wrap .mw-win-price { position: static; order: 0; border-color: var(--line); } .emb-wrap .mw-win-price .mw-win-h { display: flex; }   /* v iframe se cena nelepi ke spodni hrane, ale je hned pod 3D */
    .emb-wrap .mw-win-sum { order: 20; }                          /* shrnuti voleb na uzkem az na konec */
    .emb-wrap .mw-col-extra { display: contents; } .emb-wrap .mw-win-profile { order: 21; } .emb-wrap .mw-win-attach { order: 22; }          /* Hlavni profil a Pripni cokoli (stejne prvky jako v mini-shopu) az za shrnutim */
  }
  /* od 720 px mrizka oken: 3D (8) + cena a objednavka (4), volby nize ve 2 sloupcich (720-899) nebo ve 3 (od 900) */
  @media (min-width: 720px) {
    .emb-wrap .mw-pdg { grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-areas:
      "stage stage stage stage stage stage stage stage side side side side"
      "cfg cfg cfg cfg cfg cfg cfg cfg cfg cfg cfg cfg"
      "dim dim dim dim dim dim frame frame frame frame frame frame"
      "extras extras extras extras extras extras col3 col3 col3 col3 col3 col3"
      "extra extra extra extra extra extra . . . . . ."; }
    .emb-wrap .mw-win-stage { grid-area: stage; } .emb-wrap .mw-col-side { grid-area: side; display: flex; flex-direction: column; gap: 16px; } .emb-wrap .mw-cfgbar { grid-area: cfg; }
    .emb-wrap .mw-win-dim { grid-area: dim; } .emb-wrap .mw-win-frame { grid-area: frame; } .emb-wrap .mw-win-extras { grid-area: extras; } .emb-wrap .mw-col-3 { grid-area: col3; } .emb-wrap .mw-col-extra { grid-area: extra; display: flex; flex-direction: column; gap: 16px; }
    .emb-wrap .mw-win-price { position: static; order: 0; border-color: var(--line); } .emb-wrap .mw-win-price .mw-win-h { display: flex; }
  }
  @media (min-width: 900px) {
    .emb-wrap .mw-pdg { grid-template-areas:
      "stage stage stage stage stage stage stage stage side side side side"
      "cfg cfg cfg cfg cfg cfg cfg cfg cfg cfg cfg cfg"
      "dim dim dim dim frame frame frame frame extras extras extras extras"
      "col3 col3 col3 col3 col3 col3 col3 col3 extra extra extra extra"; }
  }
</style>
</head>
<body>
<div class="emb-wrap" id="app"><p class="mw-muted">Načítám generátor…</p></div>

</html>
