<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Náhled - rám z profilu 45x45</title>
<style>
  html,body{margin:0;padding:0;background:#e8ecf0;overflow:hidden;font-family:var(--font-main, Arial,sans-serif);}
  #panel{position:fixed;top:14px;left:14px;background:rgba(255,255,255,0.92);border:1px solid #ccc;
    border-radius:6px;padding:12px 16px;font-size:14px;z-index:10;}
  #panel h1{font-size:15px;margin:0 0 8px;}
  #panel label{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer;}
  #panel .sw{width:14px;height:14px;border-radius:3px;display:inline-block;}
  #info{position:fixed;bottom:14px;left:14px;background:rgba(255,255,255,0.92);border:1px solid #ccc;
    border-radius:6px;padding:10px 14px;font-size:12px;color:#444;max-width:520px;z-index:10;}
</style>
</head>
<body>
<div id="panel">
  <h1>Rám z profilu 45x45 - náhled 3 modelů (STEP import 2026-09-08)</h1>
  <label><span class="sw" style="background:#9fb6cc;"></span><input type="checkbox" data-key="celek" checked> celek</label>
  <label><span class="sw" style="background:#d98c8c;"></span><input type="checkbox" data-key="vnejsi"> vnější</label>
  <label><span class="sw" style="background:#8fbf8f;"></span><input type="checkbox" data-key="vnitrni"> vnitřní</label>
</div>
<div id="info">
  Rozměry (shodné u všech tří): 1200 × 1200 × 2300 mm. <b>celek</b> a
  <b>vnitřní</b> jsou geometricky totožné (ověřeno MD5 souborů) —
  <b>vnější</b> nemá vnitřní přepážku/sloupek navíc. Zaškrtni
  víc najednou pro srovnání.
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8ecf0);
const camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 1, 20000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const d1 = new THREE.DirectionalLight(0xffffff, 0.9); d1.position.set(900,1600,1300); scene.add(d1);
const d2 = new THREE.DirectionalLight(0xffffff, 0.4); d2.position.set(-700,900,-900); scene.add(d2);
scene.add(new THREE.GridHelper(3000, 30, 0x999999, 0xcccccc));

const controls = new THREE.OrbitControls(camera, renderer.domElement);

const FILES = {
  celek:   { url: './content-files/profil45_ram_preview/celek.glb',   color: 0x9fb6cc },
  vnejsi:  { url: './content-files/profil45_ram_preview/vnejsi.glb',  color: 0xd98c8c },
  vnitrni: { url: './content-files/profil45_ram_preview/vnitrni.glb', color: 0x8fbf8f },
};
const objects = {};
const loader = new THREE.GLTFLoader();

function frameCamera() {
  const box = new THREE.Box3();
  let any = false;
  Object.values(objects).forEach(o => { if (o.visible) { box.expandByObject(o); any = true; } });
  if (!any) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = maxDim * 1.6;
  camera.position.set(center.x + dist*0.7, center.y + dist*0.55, center.z + dist*0.9);
  controls.target.copy(center);
  camera.updateProjectionMatrix();
  controls.update();
}

let loadedCount = 0;
Object.entries(FILES).forEach(([key, cfg]) => {
  loader.load(cfg.url, (gltf) => {
    const obj = gltf.scene;
    obj.traverse(n => { if (n.isMesh) n.material = new THREE.MeshStandardMaterial({ color: cfg.color, metalness: 0.15, roughness: 0.7 }); });
    obj.visible = (key === 'celek');
    scene.add(obj);
    objects[key] = obj;
    loadedCount++;
    if (loadedCount === Object.keys(FILES).length) frameCamera();
  }, undefined, (err) => console.error('load fail', key, err));
});

document.querySelectorAll('#panel input[type=checkbox]').forEach(cb => {
  cb.addEventListener('change', () => {
    const key = cb.dataset.key;
    if (objects[key]) objects[key].visible = cb.checked;
    frameCamera();
  });
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
