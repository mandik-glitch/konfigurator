<style>
  /* akcent hlavniho webu (oranzova), ne akcent mini-shopu */
  :root { --accent: #ff7b29; --accent-glow: #ffa05c; --orange: #ff7b29; }
  .sh-nav-r { margin-left: auto; display: flex; gap: 1rem; align-items: center; }
  .sh-nav-r a { color: var(--text-soft); text-decoration: none; } .sh-nav-r a:hover { color: var(--accent); }

  /* staff okna navic: kusovnik (siroke) misto "doprava/priloha" */
  @media (min-width: 900px) {
    .mw-pdg { grid-template-areas:
      "stage stage stage stage stage stage stage stage side side side side"
      "cfg cfg cfg cfg cfg cfg cfg cfg cfg cfg cfg cfg"
      "dim dim dim dim frame frame frame frame extras extras extras extras"
      "bom bom bom bom bom bom bom bom col3 col3 col3 col3"; }

  }
  #stageMsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); pointer-events: none; z-index: 1; }
  .mw-win-stage .mw-win-b { position: relative; }
  /* cena a tlacitka */
  #staffPrice .big { font-size: 1.7rem; font-weight: 700; } #staffPrice .small { color: var(--muted); font-size: .8rem; }
  .sh-btns { display: flex; gap: .6rem; flex-wrap: wrap; }
  .sh-btns button { cursor: pointer; }
  button.sh-ghost { background: transparent; color: var(--text-soft); border: 1px solid var(--line); padding: .5rem .8rem; font: inherit; }
  button.sh-ghost:hover { color: var(--accent); border-color: var(--accent); }
  #sceneBtn { padding: .55rem 1rem; background: var(--accent); color: #1a1208; border: 0; font: 700 .85rem var(--mono); letter-spacing: .06em; text-transform: uppercase; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
  #sceneBtn:hover { background: var(--accent-glow); }
  #sceneStatus { font-size: .8rem; color: var(--muted); min-height: 1em; } #sceneStatus a { margin-left: 6px; color: var(--accent); }
  #staffProblems { font-size: .85rem; color: var(--error); } #staffProblems:empty { display: none; }
  #staffLinks { display: flex; gap: .8rem; flex-wrap: wrap; } #staffLinks a { color: var(--accent); font-size: .85rem; }
  #staffCode { color: var(--muted); font-size: .8rem; }
  /* kusovnik */
  #bomBody { overflow-x: auto; }
  #bomBody table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  #bomBody th, #bomBody td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; }
  #bomBody th:first-child, #bomBody td:first-child { text-align: left; }
  #bomBody td:nth-child(n+2), #bomBody th:nth-child(n+2) { white-space: nowrap; }
  #bomBody tr.sum td:nth-child(2) { white-space: nowrap; }
  #bomBody th { color: var(--muted); font-weight: 600; }
  #bomBody tr.sec td { text-align: left; color: var(--muted); font-weight: 600; padding-top: 10px; border-bottom: none; }
  #bomBody tr.sum td { font-weight: 700; border-bottom: none; }
  #bomBody tr.grp td { font-weight: 600; } #bomBody tr.grp td:first-child { text-align: left; }
  #bomBody .bom-tog { all: unset; cursor: pointer; color: var(--text); display: inline-flex; gap: 4px; align-items: baseline; } #bomBody .bom-tog:hover, #bomBody .bom-tog:focus-visible { color: var(--accent); }
  #bomBody .bom-chev { display: inline-block; width: 1em; color: var(--muted); }
  #bomBody tr.det td:first-child { padding-left: 24px; color: var(--text-soft); }
  #bomBody .note { color: var(--muted); font-size: .8rem; margin-top: 6px; }
