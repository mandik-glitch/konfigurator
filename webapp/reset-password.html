<!DOCTYPE html>
<html lang="cs">
<head>
  <script src="/js/client-errors.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nastavit nové heslo – Hliníkový konstrukční stavebnicový systém s drážkami</title>
<style>
  :root {
    --bg: #494b50; --panel-bg: #22262e; --border: #3a3f4a; --border-soft: #333333;
    --text: #e8eaed; --text-muted: #9aa4b2;
    --accent: #9fd0ff; --accent-focus: #6fa8ff;
    --btn-bg: #3a5a7a; --btn-bg-hover: #4a6a8a; --error: #e07070; --success: #7ed49a;
  }
  [data-theme="light"] {
    --bg: #eef1f5; --panel-bg: #ffffff; --border: #d7dce3; --border-soft: #e3e7ec;
    --text: #1b1e24; --text-muted: #5c6570;
    --accent: #1a6fd4; --accent-focus: #2d6cdf;
    --btn-bg: #2f6690; --btn-bg-hover: #3a76a0; --error: #c23b3b; --success: #2f9e5c;
  }
  * { box-sizing: border-box; }
  /* Logo znacky: vklada ho skript hned pod <body>, jen kdyz ho server vrati pro tenhle host (GET /api/site-brand,
     api/site_brand.py). Stranka se servi i z domen, kde znacka byt nesmi, proto v HTML neni zadne jmeno ani logo.
     Misto je vyhrazene predem, aby se karta po vlozeni loga neposunula. Vzhled loga: /css/brand-logo.css. */
  body { flex-direction: column; }
  .site-logo-slot { min-height: 34px; margin-bottom: 18px; display: flex; justify-content: center; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-main, -apple-system, "Segoe UI", Roboto, Arial, sans-serif);
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box;
  }
  .box { background: var(--panel-bg); border: 1px solid var(--border-soft); border-radius: 10px; padding: 32px; width: 340px; max-width: 100%; }
  h1 { font-size: 17px; margin: 0 0 18px; text-align: center; }
  label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 9px 10px; font-size: 14px;
  }
  input:focus { outline: 1px solid var(--accent-focus); }
  .pwrow { position: relative; margin-bottom: 14px; }
  .pwrow input { margin-bottom: 0; padding-right: 38px; }
  .pweye {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: auto; background: none; border: none; padding: 4px 6px; font-size: 15px;
    line-height: 1; opacity: .7;
  }
  .pweye:hover { background: none; opacity: 1; }
  button { width: 100%; background: var(--btn-bg); color: #fff; border: none; border-radius: 6px; padding: 10px; font-size: 14px; cursor: pointer; }
  button:hover { background: var(--btn-bg-hover); }
  button:disabled { background: var(--border); cursor: default; }
  #msg { font-size: 13px; margin-bottom: 12px; min-height: 16px; }
  #msg.ok { color: var(--success); }
  #msg.err { color: var(--error); }
  .back { display:block; text-align:center; margin-top:14px; font-size:12.5px; color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
  <div id="siteLogoSlot" class="site-logo-slot"></div>
  <script>
  // logo znacky ze serveru (jen pro hosty, kde se smi ukazat; jinak stranka zustane bez nej) - viz komentar u .site-logo-slot
  (function () {
    var slot = document.getElementById("siteLogoSlot");
    function nacti(url, kdyzSelze, hotovo) {
      var l = document.createElement("link");
      l.rel = "stylesheet"; l.href = url; l.onload = hotovo; l.onerror = kdyzSelze;
      document.head.appendChild(l);
    }
    fetch("/api/site-brand").then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (!d || !d.logo) return;
      var g = d.logo, zbyva = g.font_css ? 2 : 1;
      // logo se vlozi az kdyz je nacteny jeho vzhled i pismo webu (stejne jako na homepage) - neukaze se v nahradnim pismu
      function hotovo() { if (--zbyva === 0) slot.innerHTML = g.html; }
      if (g.font_stack) slot.style.setProperty("--font-main", g.font_stack);
      nacti(g.css, function () {}, hotovo);
      if (g.font_css) nacti(g.font_css, hotovo, hotovo);
    }).catch(function () {});
  })();
  </script>
  <div class="box">
    <h1>Nastavit nové heslo</h1>
    <div id="msg"></div>
    <form id="form">
      <div id="emailRow" style="display:none;">
        <label for="emailField">Účet</label>
        <input type="email" id="emailField" name="username" autocomplete="username" readonly>
      </div>
      <label for="password">Nové heslo (alespoň 8 znaků)</label>
      <div class="pwrow">
        <input type="password" id="password" name="new-password" autocomplete="new-password" required minlength="8">
        <button type="button" class="pweye" data-for="password">👁</button>
      </div>
      <label for="password2">Zopakuj heslo</label>
      <div class="pwrow">
        <input type="password" id="password2" name="new-password2" autocomplete="new-password" required minlength="8">
        <button type="button" class="pweye" data-for="password2">👁</button>
      </div>
      <button type="submit" id="btn">Nastavit heslo</button>
    </form>
    <a href="/login.html" class="back">← zpět na přihlášení</a>
  </div>

<script>
(function () {
  try {
    var t = localStorage.getItem("shopTheme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
fetch("/api/theme-colors?surface=eshop").then(r => r.ok ? r.json() : null).then(data => {
  if (!data) return;
  var theme = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
  var palette = data[theme];
  Object.keys(palette).forEach(function (key) {
    document.documentElement.style.setProperty("--" + key.replace(/_/g, "-"), palette[key]);
  });
}).catch(function () {});
</script>
<script>
document.querySelectorAll(".pweye").forEach(btn => {
  btn.addEventListener("click", () => {
    const input = document.getElementById(btn.dataset.for);
    input.type = input.type === "password" ? "text" : "password";
    btn.textContent = input.type === "password" ? "👁" : "🙈";
  });
});

const params = new URLSearchParams(window.location.search);
const token = params.get("token");
if (!token) {
  document.getElementById("msg").className = "err";
  document.getElementById("msg").textContent = "Chybí odkaz - vyžádej si prosím nový přes \"Zapomenuté heslo\".";
  document.getElementById("form").style.display = "none";
} else {
  // Robert 2026-07-31 ("nevyplnilo login jenom to heslo"): bez viditelneho
  // e-mailu na TETO strance si prohlizec pri ukladani noveho hesla nema k
  // cemu privazat uzivatelske jmeno - na login.html pak doplni jen heslo.
  // Zobrazeni e-mailu (readonly, autocomplete="username") tohle opravuje.
  fetch(`/api/auth/reset-password-info?token=${encodeURIComponent(token)}`)
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (!data || !data.email) return;
      const field = document.getElementById("emailField");
      // Robert 2026-07-31 (2. kolo - "návrhář hesla vyloženě píše bez
      // přihlašovacího jména"): pouhe nastaveni .value skriptem NEVYVOLA
      // input/change udalost - prohlizec (heuristika pro ulozeni hesla)
      // si zmeny nevsimne a chova se, jako by pole bylo porad prazdne.
      // Navic `readonly` pole nekdy prohlizec bere jako "neni to skutecne
      // vyplnitelne pole" a ignoruje ho úplně - proto i to odstraneno.
      field.removeAttribute("readonly");
      field.value = data.email;
      field.dispatchEvent(new Event("input", { bubbles: true }));
      field.dispatchEvent(new Event("change", { bubbles: true }));
      document.getElementById("emailRow").style.display = "";
    })
    .catch(() => {});
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const p1 = document.getElementById("password").value;
  const p2 = document.getElementById("password2").value;
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");
  msg.className = ""; msg.textContent = "";
  if (p1 !== p2) {
    msg.className = "err";
    msg.textContent = "Hesla se neshodují.";
    return;
  }
  btn.disabled = true;
  btn.textContent = "Ukládám…";
  try {
    const r = await fetch("/api/auth/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, password: p1 }),
    });
    const data = await r.json();
    if (!r.ok) {
      msg.className = "err";
      msg.textContent = data.error || "Nepodařilo se nastavit heslo.";
      btn.disabled = false;
      btn.textContent = "Nastavit heslo";
      return;
    }
    msg.className = "ok";
    msg.textContent = "Heslo bylo nastaveno. Přesměrovávám na přihlášení…";
    setTimeout(() => { window.location.href = "/login.html"; }, 1500);
  } catch (e) {
    msg.className = "err";
    msg.textContent = "Chyba spojení se serverem.";
    btn.disabled = false;
    btn.textContent = "Nastavit heslo";
  }
});
</script>
</body>
</html>
